name: check

# Tag- and PR-triggered only, never on every push to a branch
# (getmaipai/.github/CLAUDE.md > Security: "No push-triggered GitHub
# Actions in private repos... Public repos may keep cheap tag- or
# docs-triggered workflows" - catalog is public, so CI minutes are
# free, and this is the one repo in the org that takes pull requests at
# all). Runs the identical `scripts/check.sh` a contributor runs
# locally before opening a PR - one rule set, never a second copy of it
# living only in this file (docs/PACKAGES.md's own "CI on every PR"
# line, session-d-packages-and-store.md step 6).
on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  cla:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check contributor CLA
        id: cla
        continue-on-error: true
        run: cd tools && bun run src/cla.ts -- "${{ github.event.pull_request.user.login }}"

      - name: Explain missing assignment
        if: steps.cla.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- cla-check -->";
            const body = `${marker}\nThanks for the pull request. Before it can be reviewed, the copyright assignment in ASSIGNMENT.md needs your signature: reply to this comment with the sentence it asks for, and a maintainer adds you to signers.json. Nothing else changes on your side.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Clear assignment note
        if: steps.cla.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- cla-check -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: "Assignment on file. Thanks.",
              });
            }

      - name: Fail when assignment is missing
        if: steps.cla.outcome == 'failure'
        run: exit 1

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      # scripts/check.sh's own standards-core step needs a sibling
      # ../.github checkout (MAIPAI_STANDARDS_DIR), the identical layout
      # a contributor's own machine has. Pinned to std-v0.2.0 (the exact
      # tag this repo's docs/dev.md and every other getmaipai repo
      # pin to), never .github's own main - CI must run the SAME
      # standards version a contributor tested against locally, not
      # whatever landed on .github's main after they last pulled it.
      - name: Check out @maipai/standards (std-v0.2.0)
        uses: actions/checkout@v4
        with:
          repository: getmaipai/.github
          ref: std-v0.2.0
          path: .github-standards

      # tools/package.json pins @maipai/spec as
      # "file:../../shared-tags/spec-spec-v0.1.1/spec" - a real relative
      # filesystem path bun resolves at install time, not an env-var
      # override like MAIPAI_STANDARDS_DIR above, so scripts/check.sh's
      # own ensure-tag.sh call (SHARED-PIN-01; see home/docs/dev.md,
      # "Pins moved to per-tag worktrees") has to be able to create that
      # exact path itself, via a real `git worktree add`, the same way
      # it does on a contributor's machine - which means this checkout
      # needs the tag's ref actually present, not just checked out.
      # actions/checkout@v4's own action.yml documents fetch-tags
      # defaulting to false (checked directly, not assumed), so a plain
      # `ref: spec-v0.1.1` checkout couldn't be trusted to leave a
      # resolvable `refs/tags/spec-v0.1.1` behind for `git worktree add`
      # to use. `fetch-tags: true` at the default shallow depth (rather
      # than `fetch-depth: 0`'s full history of every branch and tag, a
      # real and growing transfer cost this repo doesn't otherwise pay)
      # is tried first here since it's cheaper, if a shallow-but-tagged
      # fetch still leaves the tag's commit and tree fetchable for `git
      # worktree add` - to be confirmed on a live CI run before this
      # lands; `fetch-depth: 0` is the fallback if it doesn't (that one
      # definitely works: "all history for all branches and tags," the
      # field's own description).
      # actions/checkout@v4 refuses any `path` that resolves outside
      # $GITHUB_WORKSPACE (confirmed against its own source, not just
      # docs), so the sibling relationship can't come from `path:
      # ../shared` directly - checked out nested instead, then symlinked
      # one level up (next step), which actions/checkout's own guard
      # doesn't touch (it's a plain shell command, not a second
      # checkout).
      - name: Check out getmaipai/shared (tags fetched, for ensure-tag.sh's own tag worktrees)
        uses: actions/checkout@v4
        with:
          repository: getmaipai/shared
          fetch-tags: true
          path: shared

      - name: Link getmaipai/shared as catalog's sibling
        run: ln -s "$GITHUB_WORKSPACE/shared" "$GITHUB_WORKSPACE/../shared"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # check-core.sh's own gitleaks step only WARNS (never fails) when
      # gitleaks isn't on PATH, so CI installs it explicitly rather than
      # silently skipping the secret scan - a pinned binary download from
      # gitleaks' own GitHub releases, not a third-party marketplace
      # action, matching the org's own "download it, depend on it, never
      # vendor" stance for tooling (getmaipai/.github/CLAUDE.md > Third-
      # party code and assets). Version pinned from this session's own
      # knowledge, not verified against a live release list (no network
      # access from here) - confirm this tag and asset name still
      # resolve on the FIRST real CI run, and bump it on any later
      # gitleaks update.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run check.sh
        env:
          MAIPAI_STANDARDS_DIR: ${{ github.workspace }}/.github-standards
        run: bash scripts/check.sh

      - name: Write package check JSON
        if: always()
        run: cd tools && bun run src/check.ts --json > "$RUNNER_TEMP/check.json" || true

      - name: Summarize package check
        if: always()
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const summary = process.env.GITHUB_STEP_SUMMARY;
          let report;
          try {
            report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/check.json`, "utf8"));
          } catch {
            fs.appendFileSync(summary, "Package check produced no report.\n");
            process.exit(0);
          }
          const lines = [
            "## Package check",
            `${report.passing}/${report.total} packages passing`,
            "",
            "| Package | Result | Problems |",
            "| --- | --- | ---: |",
          ];
          for (const pkg of report.packages) {
            const problems = [pkg.lint, pkg.scorecard, pkg.vendoring, pkg.licence, pkg.bannedApi]
              .reduce((count, errors) => count + errors.length, 0);
            lines.push(`| ${pkg.dir} | ${pkg.passing ? "ok" : "FAIL"} | ${problems} |`);
          }
          fs.appendFileSync(summary, `${lines.join("\n")}\n`);
          NODE

  # Permission changes need review on pull requests, while tag runs only
  # publish the catalog and have no pull request to annotate. Update one
  # comment per PR so the review surface stays current instead of noisy.
  permission-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: Check out PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install tools dependencies
        run: cd tools && bun install --frozen-lockfile

      - name: Render permission diff
        run: cd tools && bun run src/permission-diff.ts -- "$GITHUB_WORKSPACE/base" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/permission-diff.md"

      - name: Update permission-diff comment
        uses: actions/github-script@v7
        env:
          DIFF_PATH: ${{ runner.temp }}/permission-diff.md
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- permission-diff -->";
            const body = `${marker}\n${fs.readFileSync(process.env.DIFF_PATH, "utf8")}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
